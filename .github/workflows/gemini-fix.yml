name: Gemini Autonomous Agent
on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

jobs:
  build-and-commit:
    if: contains(github.event.comment.body, '@gemini-cli') || contains(github.event.issue.labels.*.name, 'gemini')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gemini Agent
        uses: google-github-actions/run-gemini-cli@v1
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
